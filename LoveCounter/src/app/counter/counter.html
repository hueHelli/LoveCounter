<div class="w-[70vw] h-[21vh] mt-[7vh] ml-[15vw] bg-white rounded-2xl shadow-2xl relative p-[5%]">
    <h3 class="text-black text-xl font-mono font-bold absolute top-8">Time Together</h3>
    <div class="grid grid-cols-7 gap-1 my-flex">
        <div *ngFor="let time of timer">
            <div class="bg-pink-600 text-center h-[68%] rounded-lg text-2xl p-[10%]">{{ time.value }}</div>
            <p class="w-[100%] text-center mt-[5%]">{{ time.unit }}</p>
        </div>
    </div>
</div>
